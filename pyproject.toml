[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "jarvis-hermes"
version = "0.1.0"
description = "MCP-first personal assistant foundations for Hermes"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.28,<2",
    "pyyaml>=6.0.3",
    # zoneinfo ha bisogno del DB IANA su Windows (CI windows-latest); su Linux usa /usr/share/zoneinfo.
    "tzdata; platform_system == 'Windows'",
]

[project.scripts]
jarvis = "jarvis_hermes.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis_hermes"]
